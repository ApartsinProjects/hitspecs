{id:"CY3",conc:"CY",
title:"Application Security and Secure Development",
description:"Find, exploit, and eliminate web application vulnerabilities by mastering OWASP Top 10, secure code review, threat modeling, automated scanning integration, and API security.",
roles:[
{role:"Application Security Engineer",does:"Performs manual and automated security testing of web applications and APIs, conducts secure code reviews with SAST tooling (Semgrep, SonarQube), integrates DAST scanners (OWASP ZAP, Burp Suite) into CI/CD pipelines, produces vulnerability reports with CVSS-scored findings and remediation guidance, and runs developer security training on OWASP Top 10."},
{role:"Penetration Tester (Web Application)",does:"Executes structured web application penetration tests following OWASP Testing Guide methodology, manually exploits authentication bypasses, injection flaws, IDOR, SSRF, and logic errors, produces professional findings reports with reproduction steps and exploit code, and validates remediation effectiveness in retest engagements."},
],
principles:[
"The OWASP Top 10 as an empirical vulnerability taxonomy: each category represents a class of root causes with high real-world prevalence, grounded in industry breach and vulnerability data.",
"Injection as a parsing failure: SQL injection, command injection, XPath injection, and LDAP injection all arise when attacker-controlled input is interpreted as code because the application fails to separate data from instruction.",
"Cross-site scripting: stored, reflected, and DOM-based XSS each introduce attacker-controlled JavaScript into the browser context of another user; Content Security Policy is the primary architectural defense.",
"Authentication and session management weaknesses: credential stuffing, brute force, session fixation, and weak token entropy are all failure modes of authentication systems that did not apply least-privilege and defense-in-depth.",
"Broken access control and IDOR: authorization must be enforced on every request server-side; client-side hiding of controls and relying on obscure identifiers are not access control.",
"Server-side request forgery: by controlling a URL parameter that the server fetches, an attacker can pivot to internal services, metadata endpoints, and back-end APIs that are not externally reachable.",
"Insecure deserialization: untrusted data passed to a deserializer can trigger arbitrary object instantiation and method calls; the defense is to never deserialize untrusted input or to use a safe data format such as JSON.",
"Cryptographic failures in web applications: using MD5/SHA-1 for passwords, storing secrets in code, weak random for tokens, and missing TLS on sensitive routes are all cryptographic failures with concrete exploitation paths.",
"Threat modeling DFDs for web applications: data flow diagrams identify every point where attacker-controlled data crosses a trust boundary, making the application's attack surface visible before testing begins.",

{id:"DF2",conc:"DF",
title:"Mission-Critical Real-Time Systems",
description:"Design, implement, and certify software for systems where timing failures have safety consequences, applying RTOS scheduling theory, deterministic communication protocols, formal verification, and safety-standard process.",
roles:[
{role:"Embedded Real-Time Software Engineer",does:"Develops and integrates tasks on RTOS platforms (FreeRTOS, Zephyr, VxWorks), performs schedulability analysis with Rate Monotonic and EDF algorithms, implements inter-task communication with bounded queues and semaphores, writes ISR-safe device drivers, profiles worst-case execution time with hardware timing instrumentation, and participates in IEC 61508 or DO-178C software verification activities."},
{role:"Functional Safety Engineer",does:"Defines safety requirements and hazard analyses (FMEA, FTA) for safety-critical systems, maps software design decisions to ASIL or SIL integrity levels, authors qualification plans for safety-critical software tools, reviews code against MISRA C or AUTOSAR C++ guidelines, and coordinates DO-178C compliance evidence packages including requirements traceability matrices and structural coverage reports."},
],
principles:[
"Hard versus soft real-time semantics: a hard real-time deadline violation is a system failure; a soft real-time deadline violation degrades quality; a firm deadline violation makes the result worthless but not catastrophic. The system's safety case determines which class applies.",
"Worst-case execution time analysis: WCET is an upper bound on task runtime regardless of input; hardware pipelines, caches, and branch predictors make static WCET analysis conservative but sound; measurement-based WCET requires probabilistic or extreme-value-theoretic methods.",
"Rate Monotonic scheduling: fixed-priority assignment inversely proportional to period is provably optimal among fixed-priority algorithms; the utilization bound for n tasks is n(2^{1/n}-1), approaching ln 2 as n grows.",
"Earliest Deadline First scheduling: dynamic-priority assignment to the task with the nearest absolute deadline is optimal among preemptive scheduling algorithms; utilization can reach 100% in the feasible region.",
"Priority inversion and the priority ceiling protocol: a low-priority task holding a shared resource can block a high-priority task; the priority ceiling protocol bounds the blocking time by elevating resource holders to the resource's priority ceiling.",
"Inter-task communication patterns: shared memory with spinlocks is lowest latency but requires careful mutual exclusion; message queues provide temporal decoupling at the cost of copying; lock-free ring buffers enable single-producer/single-consumer transfer without locks.",
"Interrupt latency and ISR design: ISRs must be short, deterministic, and non-blocking; deferred processing moves non-time-critical work to a high-priority task via a semaphore signal, bounding interrupt latency.",
"Time-Triggered Architecture and TT-Ethernet: statically scheduled time slots with no collision eliminate arbitration jitter; TT-Ethernet and FlexRay provide deterministic real-time communication for safety-critical systems.",
"Safety integrity levels and IEC 61508 / DO-178C: SIL/DAL levels quantify the probability of dangerous failure and mandate corresponding development rigor; higher levels require formal methods, full MC/DC coverage, and independence between development and verification.",
"Formal verification with model checking: model checkers (SPIN, UPPAAL) exhaustively verify temporal logic properties over finite-state models, providing mathematical proof of deadlock freedom and timing bound satisfaction for safety cases.",
],

const INSTR={
  "01":"Course title and a one-sentence description of the subject this course covers.",
  "02":"Each role as it appears in real job postings, and what professionals in that role actually build, decide, and deliver.",
  "03":"Ten transferable principles students carry beyond this course: theory, algorithms, data structures, or domain science that holds regardless of which tools are in use.",
  "04":"Ten tools, platforms, libraries, or APIs students work with hands-on during this course.",
  "05":"Up to five prerequisite concepts or skills students must have mastered before starting the course.",
  "06":"Up to five topics that belong to the field but are intentionally excluded due to lack of teaching time.",
  "07":"Four dimensions of the student project: description, tangible deliverable, feedback structure, and conceptual and technical depth.",
};
const REQ={
  "02":"Prepare students for 2 specific industry roles; scope the course around what professionals in those roles actually build and deliver.",
  "03":"Ground students in principles that remain valid regardless of which tools or platforms are in use.",
  "04":"Give students direct hands-on experience with the tools professionals use today.",
  "05":"Require students to enter with a defined baseline; every item must be mastered before starting the course.",
  "06":"These topics are part of the field but intentionally excluded due to lack of teaching time; each belongs in a follow-up course.",
  "07":"Build a significant project progressively throughout the semester, resulting in a technically deep, demonstrable, portfolio-ready outcome.",
};
function escHtml(s){
  return String(s||"").replace(/[—–]/g,", ").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function listTable(items,col){
  return "<table><thead><tr><th style='width:32px'>#</th><th>"+col+"</th></tr></thead><tbody>"+
    items.map((t,i)=>"<tr><td class='num-cell'>"+String(i+1).padStart(2,"0")+"</td><td>"+escHtml(t)+"</td></tr>").join("")+
    "</tbody></table>";
}
function rolesTable(roles){
  return "<table><thead><tr><th>Job Role</th><th>What professionals in this role actually do</th></tr></thead><tbody>"+
    roles.map(r=>"<tr><td style='width:32%;font-weight:600'>"+escHtml(r.role)+"</td><td>"+escHtml(r.does)+"</td></tr>").join("")+
    "</tbody></table>";
}
function projectTable(p){
  return "<table><tbody>"+[
    {l:"Project Description",t:"What problem and solution?",v:p.description},
    {l:"Tangible Demonstrable Outcome",t:"What artifacts does the student submit?",v:p.outcome},
    {l:"Feedback Structure",t:"How is progress reviewed?",v:p.feedback},
    {l:"Conceptual and Technical Depth",t:"What makes it demanding?",v:p.depth},
  ].map(r=>"<tr><td class='label-cell'>"+escHtml(r.l)+"<small>"+escHtml(r.t)+"</small></td><td>"+escHtml(r.v)+"</td></tr>").join("")+
    "</tbody></table>";
}
function sec(num,title,req,instr,body){
  return "<div class='sec'><div class='sec-head'><span class='sec-num'>"+num+"</span> "+title+"</div>"+
    (req?"<div class='sec-req'>"+escHtml(req)+"</div>":"")+
    (instr?"<div class='sec-instr'>"+escHtml(instr)+"</div>":"")+
    body+"</div>";
}
function renderCard(c){
  const color=CONC[c.conc]?.color||"#1B9E7A";
  return `<section class="card" id="${c.id}">
<div class="card-eyebrow"><span class="card-id" style="background:${color}">${c.id}</span><span class="card-conc">${escHtml(CONC[c.conc]?.label||c.conc)}</span></div>
<h2 class="card-title">${escHtml(c.title)}</h2>
<p class="card-desc">${escHtml(c.description)}</p>
<div class="section-grid">
<div class="full">${sec("01","Course Info","",INSTR["01"],
  "<table><tbody><tr><td class='label-cell'>Course Title</td><td><strong>"+escHtml(c.title)+"</strong></td></tr>"+
  "<tr><td class='label-cell'>Description <small>(one sentence)</small></td><td>"+escHtml(c.description)+"</td></tr></tbody></table>")}</div>
<div class="full">${sec("02","Target Job Roles and Responsibilities",REQ["02"],INSTR["02"],rolesTable(c.roles))}</div>
<div>${sec("03","Transferable Engineering and Scientific Principles",REQ["03"],INSTR["03"],listTable(c.principles,"Transferable Principle"))}</div>
<div>${sec("04","Tools, Platforms, and Libraries",REQ["04"],INSTR["04"],listTable(c.tools,"Tool / Platform / Library / API"))}</div>
<div>${sec("05","Prerequisite Requirements",REQ["05"],INSTR["05"],listTable(c.prerequisites,"Prerequisite Concept / Skill"))}</div>
<div>${sec("06","Topics Not Covered in This Course",REQ["06"],INSTR["06"],listTable(c.gaps,"Topic Not Covered"))}</div>
<div class="full">${sec("07","Student Project",REQ["07"],INSTR["07"],projectTable(c.project))}</div>
</div></section>`;
}
function renderSidebar(){
  const sb=document.getElementById("sidebar");
  CONC_ORDER.forEach(k=>{
    const courses=COURSES.filter(c=>c.conc===k);
    if(!courses.length)return;
    const m=CONC[k],grp=document.createElement("div");
    grp.innerHTML=`<div class="conc-hd"><span class="conc-dot" style="background:${m.color}"></span>${k} · ${m.label}</div>`;
    courses.forEach(c=>{
      const a=document.createElement("a");
      a.className="course-link";a.href="#"+c.id;
      a.innerHTML=`<span class="cl-id">${c.id}</span>${c.title}`;
      grp.appendChild(a);
    });
    sb.appendChild(grp);
  });
}
function renderCards(){document.getElementById("cards").innerHTML=COURSES.map(renderCard).join("");}
function initScrollSpy(){
  const links=document.querySelectorAll(".course-link");
  document.querySelectorAll(".card").forEach(c=>new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle("active",l.getAttribute("href")==="#"+e.target.id));}});
  },{threshold:0.15,rootMargin:"-60px 0px -60% 0px"}).observe(c));
}
function toggleTheme(){
  const r=document.documentElement,c=r.getAttribute("data-theme");
  r.setAttribute("data-theme",c==="dark"?"light":c==="light"?"dark":(window.matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
}
renderSidebar();renderCards();initScrollSpy();
</script>
