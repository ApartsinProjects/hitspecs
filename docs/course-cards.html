{id:"SE1",conc:"SE",
title:"Cloud Computing and Cloud-Native Platforms",
description:"Design and build scalable cloud applications by selecting the right compute, storage, networking, and managed-service patterns for each workload, then validate choices through load testing and observability evidence.",
roles:[
{role:"Cloud Infrastructure Engineer",does:"Designs and provisions scalable cloud architectures using Infrastructure-as-Code, configures autoscaling policies and load balancers, models availability and cost trade-offs across storage and compute options, monitors SLOs with metrics and alerts, and leads post-incident capacity analysis."},
{role:"Platform Engineer / DevOps Engineer",does:"Containerizes application components and maintains Kubernetes clusters, builds CI/CD pipelines for cloud-native services, configures API gateways and worker queues for async workflows, and responds to production incidents using distributed tracing and structured logging."},
],
principles:[
"Cloud service models (XaaS taxonomy): IaaS delivers raw compute, storage, and networking; PaaS adds a managed runtime and middleware layer; SaaS delivers a full application; FaaS (serverless functions) charges per invocation with zero idle cost. The model chosen determines what the team owns versus what the provider manages.",
"Regions, availability zones, and fault domains: a cloud region is an independent geographic cluster of data centers; availability zones within a region are physically separate power and network domains. Distributing workloads across AZs eliminates single points of failure at the infrastructure level.",
"Cloud compute primitives: virtual machines provide full OS isolation with predictable, consistent CPU and memory; containers share the host kernel for lower overhead and faster startup; serverless functions abstract away all infrastructure and scale to zero. Each primitive trades control for operational burden differently.",
"Cloud storage taxonomy: object storage (S3-compatible) stores blobs with a flat namespace, high durability, and HTTP access, suited to files, media, and backups; block storage attaches as a virtual disk to a single compute instance for low-latency random I/O; file storage provides a shared POSIX-mountable filesystem; managed databases offload engine, replication, and backup operations entirely to the provider.",
"Virtual Private Cloud networking: a VPC is an isolated virtual network within the cloud; subnets partition the VPC by availability zone and public/private exposure; route tables control traffic paths; internet gateways, NAT gateways, and VPC peering connect VPCs to the internet and to each other; security groups are stateful per-instance firewalls.",
"Cloud shared responsibility model: the provider is responsible for security of the cloud (physical infrastructure, hypervisors, managed service internals); the customer is responsible for security in the cloud (OS patching, application code, IAM policies, data encryption, network configuration). Misunderstanding this boundary is the root cause of most cloud breaches.",
"Identity and Access Management: IAM principals (users, roles, service accounts) are granted policies that explicitly permit actions on resources; the principle of least privilege restricts each principal to the minimum permissions its workload requires; role assumption replaces long-lived credentials with short-lived tokens.",
"Infrastructure-as-Code and declarative provisioning: expressing infrastructure as version-controlled configuration (Terraform, CloudFormation) makes environments reproducible, auditable, and reviewable; drift between declared and actual state becomes detectable and correctable automatically.",
"Stateless service design and horizontal scaling: eliminating server-side session state allows any instance to serve any request, enabling load balancers to distribute traffic freely and autoscalers to add or remove instances without draining state; managed load balancers and autoscaling groups implement this pattern as a provider-managed service.",
"Cloud unit economics: compute is priced by vCPU-hour and varies across instance families (general-purpose, memory-optimized, GPU); storage is priced per GB and per operation; data transfer into the cloud is typically free while egress carries a significant per-GB charge. Reserved and savings-plan commitments reduce on-demand rates by 30-60% in exchange for usage commitments; idle resources waste budget in ways on-premises hardware does not.",
],
tools:["Docker","Kubernetes","Helm","Terraform","AWS Lambda","Amazon DynamoDB","Amazon SQS/SNS","Redis","Prometheus","Grafana"],
prerequisites:[
"Operating systems fundamentals including processes, memory management, and filesystems",
"Computer networking including TCP/IP, DNS, HTTP/HTTPS, and basic load-balancing concepts",
"Software engineering and at least one server-side programming language",
"Basic Linux command-line proficiency",
"Relational databases and SQL fundamentals",
],
gaps:[
"Multi-cloud and hybrid-cloud architectures: cross-provider network interconnects, identity federation, and cost arbitrage strategies across AWS, GCP, and Azure.",
"Service mesh and advanced networking: traffic management, mutual TLS, observability, and policy enforcement via Istio or Envoy in a microservices environment.",
"Cloud security and compliance engineering: fine-grained IAM policy design, encryption key management, VPC architecture, and evidence collection for SOC 2 and HIPAA audits.",
"FinOps and cloud cost optimization: reserved instance and savings-plan strategy, spot-instance interruption handling, and showback/chargeback models for engineering teams.",
"Managed database internals and query optimization: index design, query planning, replication lag, and connection-pool management for cloud-hosted relational and NoSQL databases.",
],
project:{
description:"Teams design and build a cloud-native application with a REST API layer, durable relational storage, object storage, asynchronous worker queues, a caching layer and CDN, and complete Infrastructure-as-Code provisioning, then load-test the system and document scalability, reliability, and cost evidence.",
outcome:"A deployed cloud application with Terraform-managed infrastructure, k6 load-test reports showing throughput and latency behavior under target SLOs, Prometheus/Grafana dashboards covering all four golden signals, a documented cost breakdown, and a written architecture defense comparing the chosen design against at least two rejected alternatives.",
feedback:"Milestone 1 covers IaC provisioning and basic API with written feedback on security group design and resource sizing. Milestone 2 evaluates async worker integration, caching correctness, and CDN configuration. The final milestone is a full load-tested deployment with observability, assessed through a live demo and architecture defense Q&A.",
depth:"Students must make principled trade-offs between synchronous and asynchronous processing, select between SQL and NoSQL storage based on access-pattern analysis, design idempotent message consumers, configure autoscaling policies with load-test evidence, and connect the circuit-breaker and event-driven patterns to the CAP and BASE theoretical foundations.",
}},
{id:"SE2",conc:"SE",
title:"Secure and Reliable Software Development",
description:"Engineer software that is correct, testable, and secure by design, integrating black-box test theory, mutation testing, threat modeling, OWASP remediation, and CI/CD quality gates throughout the development lifecycle.",
roles:[
{role:"Application Security Engineer",does:"Performs threat modeling using DFDs and trust boundaries on new features before implementation, integrates SAST and DAST tools into CI/CD pipelines, remediates OWASP Top 10 vulnerabilities with root-cause analysis, conducts dependency audits using SCA tooling, and writes security test plans and acceptance criteria."},
{role:"Software Development Engineer in Test (SDET)",does:"Designs and implements automated test suites covering unit, integration, contract, browser E2E, and mutation tests; defines coverage targets and interprets mutation scores as test-suite quality signals; and configures CI/CD quality gates that block merges on coverage, mutation-kill-rate, or security-scan failures."},
],
principles:[
"Test automation pyramid: unit tests verify individual functions in isolation at minimal cost and millisecond speed; integration tests verify component interactions against real databases and queues; E2E tests verify full user journeys through the browser. The pyramid shape prescribes the optimal ratio — many unit, fewer integration, fewest E2E — to keep the suite fast and maintainable.",
"Black-box test design from input partitions: equivalence partitioning divides the input space into classes where all members should behave identically; boundary value analysis targets the edges of each class where off-by-one defects cluster; decision tables cover combinations of conditions. These techniques derive test cases from specification, not from reading the implementation.",
"Coverage criteria and their limits: statement, branch, and MC/DC coverage form a lattice of increasing rigor; a 100% branch-covered module can still contain undetected defects if its assertions are weak. Coverage is a necessary floor, not a quality ceiling.",
"Mutation testing as a test-suite quality signal: artificially injecting small syntactic defects (changing an operator, flipping a condition, deleting a statement) and measuring how many the suite kills quantifies assertion strength in a way line coverage cannot. A surviving mutant identifies a gap to close, not just a line to cover.",
"Consumer-driven contract testing: each downstream consumer publishes a contract describing the response shape it depends on; the provider's CI pipeline verifies all contracts before merging, enabling independent deployment of services without shared integration environments.",
"Threat modeling as a design-time activity: drawing a data flow diagram and walking each flow through STRIDE (Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege) before writing code surfaces security requirements that are expensive or impossible to retrofit afterward.",
"Defense in depth: layering independent controls at each trust boundary — input validation, parameterized queries, output encoding, authentication, RBAC authorization, rate limiting — ensures no single failure gives an attacker a complete win.",
"Principle of least privilege: every principal (user, service account, background job, CI runner) should hold only the permissions required for its current task, revoked immediately afterward; this limits the blast radius of any single compromise.",
"OWASP Top 10 as an empirically ranked vulnerability taxonomy: the list distills the highest-impact, most prevalent web application attack classes from aggregated breach data; mapping each finding to a Top 10 category gives it a common vocabulary and a body of remediation guidance.",
"Software supply-chain security: every imported dependency is a transitive trust decision; SBOM generation records what is in the build; SCA tools flag known CVEs at build time; pinning dependency versions to verified hashes prevents substitution attacks; provenance attestation links a released artifact back to a specific source commit and build environment.",
],
tools:["pytest","coverage.py","mutmut","Playwright","Pact","SonarQube","Semgrep","OWASP ZAP","Snyk","GitHub Actions"],
prerequisites:[
"Software engineering and object-oriented programming in at least one language",
"Basic computer networking including HTTP semantics, cookies, and the request-response model",
"Relational databases and basic SQL",
"Version control with Git including branching and pull requests",
"Basic web application architecture including client, server, and database tiers",
],
gaps:[
"Penetration testing and red-team offensive security: manual exploitation of OWASP vulnerabilities, privilege escalation, lateral movement, and structured penetration testing methodology.",
"Cryptography engineering: implementing and auditing TLS configuration, certificate lifecycle management, and key rotation procedures.",
"Formal verification and model checking: specifying safety properties with temporal logic and using tools such as TLA+ or Alloy to verify distributed protocol designs.",
"Chaos engineering and resilience testing: fault injection frameworks, game-day exercises, and statistical analysis of system behavior under realistic failure scenarios.",
"Mobile application security: iOS and Android-specific vulnerability classes, OWASP Mobile Top 10, binary analysis, and secure data storage on device.",
],
project:{
description:"Teams take an existing web application with known quality and security weaknesses and engineer it to be secure, thoroughly tested, and reliably observable by building a comprehensive automated test suite, producing a formal threat model with OWASP remediation evidence, integrating SAST, DAST, and dependency scanning into a CI/CD pipeline with enforced quality gates, and establishing SLO-backed observability.",
outcome:"A hardened application repository with an automated test suite spanning unit, integration, contract, browser E2E, and mutation tests; a documented threat model with DFD and mitigated threat entries; a CI/CD pipeline that blocks merges on coverage, mutation-kill-rate, SAST severity, and dependency-vulnerability thresholds; Prometheus/OpenTelemetry dashboards with defined SLOs; and a security findings report.",
feedback:"Milestone 1 reviews the threat model and initial test suite with written feedback on unmitigated DFD threat paths and assertion strength. Milestone 2 evaluates OWASP remediation with SAST/DAST scanner evidence and contract-test coverage. The final milestone is the fully gated CI/CD pipeline with SLO dashboards, assessed through a live pipeline demo and walkthrough of the mutation-score improvement.",
depth:"Students must connect black-box test design theory to concrete test cases derived from equivalence classes in the application's input space, interpret mutation scores to diagnose specific assertion weaknesses, trace each OWASP vulnerability class to a specific DFD threat boundary, and configure pipeline gates that enforce quality without creating unreasonable delivery friction.",
}},
{id:"SE3",conc:"SE",
title:"Modern Front-End Web Development",
description:"Build responsive, accessible, interactive user interfaces with React and Vue component frameworks, applying unidirectional data flow, WCAG accessibility, performance optimization, and automated testing throughout.",
roles:[
{role:"Front-End Engineer",does:"Builds component-based user interfaces in React or Vue, manages application state with Redux Toolkit or Pinia, integrates REST and GraphQL APIs, ensures WCAG AA accessibility compliance with axe DevTools audits, and writes component and interaction tests using Vitest and Playwright."},
{role:"UI Performance Engineer",does:"Profiles and optimizes web application loading and rendering performance using Lighthouse and browser DevTools, implements code-splitting and lazy-loading strategies, configures Vite build output and asset caching headers, and evaluates rendering-strategy trade-offs (CSR, SSR, SSG) for SEO and time-to-interactive targets."},
],
principles:[
"Component model and encapsulation: UI is decomposed into composable, reusable units with explicit props interfaces and scoped styles, reducing the cognitive surface area of each change.",
"Unidirectional data flow: state descends through props and user events ascend through callbacks or store dispatches, eliminating hidden coupling between sibling components.",
"Virtual DOM reconciliation: the framework diffs a virtual representation of the DOM against the previous render and applies only the minimal set of real DOM mutations, decoupling declarative render logic from imperative DOM manipulation.",
"Reactive state and derived computation: when state changes, the framework automatically recomputes all dependent views, enforcing a clean separation between data and presentation logic.",
"CSS cascade, specificity, and the box model: these browser fundamentals underlie all framework abstractions; misunderstanding them produces bugs that no framework can fix.",
"WCAG 2.1 accessibility requirements: semantic HTML elements, ARIA roles and live regions, sufficient color contrast, and full keyboard navigability are both ethical obligations and legal requirements in many jurisdictions.",
"Critical rendering path: HTML parsing, CSSOM construction, layout, paint, and compositing are sequential; blocking resources on this path directly increase time-to-interactive and must be minimized.",
"Module bundling and tree-shaking: a bundler statically analyzes the import graph and eliminates dead code at build time, directly reducing the JavaScript payload delivered to the browser.",
"HTTP caching semantics: cache-control directives, ETags, and immutable hashing of asset filenames control how aggressively browsers and CDNs cache resources, determining the performance of repeat visits.",
"Rendering strategy trade-offs: client-side rendering, server-side rendering, static site generation, and incremental static regeneration each make different commitments about TTFB, SEO crawlability, build complexity, and server cost.",
],
tools:["React","Vue","TypeScript","Vite","Redux Toolkit","React Router","Tailwind CSS","Vitest","Playwright","axe DevTools"],
prerequisites:[
"Programming fundamentals including functions, control flow, closures, and data structures",
"HTML and the DOM including element hierarchy, semantic tags, and event handling",
"CSS fundamentals including the box model, selectors, specificity, and Flexbox layout",
"JavaScript including ES6+ features: modules, arrow functions, promises, async/await, and destructuring",
"Basic HTTP and the browser request-response model",
],
gaps:[
"Server-side rendering frameworks at production scale: Next.js, Nuxt, and Remix routing models, edge-deployed SSR, and partial hydration for large-scale applications.",
"Micro-frontend architecture: independently deployed front-end modules, module federation with Webpack or Vite, and cross-team style and state isolation strategies.",
"Web animation and motion design: CSS animations, the Web Animations API, GSAP, and accessible animation patterns that respect reduced-motion preferences.",
"Cross-platform mobile development: React Native, Ionic, and Capacitor for building native-feeling iOS and Android applications from a web codebase.",
"Browser engine internals: V8 JIT compilation and memory management, advanced Chrome DevTools performance profiling, and layout/compositing layer debugging.",
],
project:{
description:"Teams design and build a single-page web application with at least three user-facing features, implementing a component hierarchy with shared state management, responsive layouts that work from 375px to 1440px, WCAG AA accessibility, an optimized production build, and a comprehensive automated test suite.",
outcome:"A deployed SPA accessible at a public URL, with documented Lighthouse scores for performance and accessibility (both above 90), a component and E2E test coverage report, a Vite bundle analysis showing bundle size and chunk strategy, and a technical presentation comparing at least two state-management and rendering decisions with evidence from profiling.",
feedback:"Milestone 1 reviews the component hierarchy, routing, and initial API integration with written feedback on prop-drilling patterns and component boundaries. Milestone 2 evaluates state management correctness and API error handling with peer review. The final milestone is the fully tested, accessible, and performance-optimized application, assessed through a live Lighthouse audit and code walkthrough.",
depth:"Students must reconcile the declarative component model with practical shared-state requirements, trace specific performance bottlenecks through the critical rendering path to a concrete code fix, implement accessibility as an architectural constraint from the first milestone, and justify their rendering strategy choice with measured TTFB and Lighthouse data.",
}},
{id:"SE4",conc:"SE",
title:"Back-End Web Development and APIs",
description:"Design server-side applications and well-structured REST and GraphQL APIs with attention to relational data modeling, authentication, caching, concurrency, and horizontal scalability.",
roles:[
{role:"Back-End Engineer",does:"Designs and implements REST and GraphQL APIs using Express or FastAPI, models relational schemas with normalization and migration management, implements JWT-based authentication and role-based authorization, tunes slow queries with index analysis, and writes integration and contract tests covering the data layer and API contracts."},
{role:"API Platform Engineer",does:"Manages API versioning strategies and consumer-driven contract governance across multiple client teams, designs caching and rate-limiting policies, benchmarks API throughput and latency with k6 load tests, instruments services with structured logging and distributed tracing, and designs the horizontal-scaling strategy for peak-traffic handling."},
],
principles:[
"REST architectural constraints: statelessness, uniform interface, resource identification via URIs, and representation-based interaction define a scalable architectural style independent of any framework.",
"Database normalization and normal forms: eliminating repeating groups, partial dependencies, and transitive dependencies through 1NF, 2NF, and 3NF removes update anomalies and ensures data integrity.",
"ACID properties: atomicity, consistency, isolation, and durability define the guarantee contract of a database transaction; each property has a measurable cost and should be selected deliberately.",
"Database indexing and query cost: B-tree indexes accelerate range and equality queries by reducing I/O at the cost of write overhead and storage; index selectivity and query execution plans determine whether an index helps or harms.",
"Authentication versus authorization: JWTs encode verified identity claims as signed tokens; authorization enforces what an authenticated identity may do, requiring a separate policy layer such as RBAC or ABAC.",
"Caching consistency patterns: cache-aside, write-through, and write-behind each make different guarantees about data freshness; invalidation strategy is the hardest problem and must be designed alongside the caching policy.",
"GraphQL type system and schema contracts: the schema is a typed interface contract between client and server; its single-endpoint flexibility enables client-driven queries but requires careful depth-limiting and cost analysis to prevent denial-of-service.",
"CAP theorem applied to database selection: strong consistency and high availability trade off during network partitions; relational databases typically favor CP while document stores often favor AP.",
"API versioning and backward compatibility: URI versioning, content negotiation, and consumer-driven contract tests each provide different levels of compatibility enforcement and deployment flexibility.",
"Horizontal scaling under concurrency: stateless service design, connection pooling, and careful isolation-level selection enable safe parallel request processing without coordination overhead.",
],
tools:["FastAPI","Express","PostgreSQL","SQLAlchemy","Apollo Server (GraphQL)","Redis","OpenAPI","Postman","Docker","k6"],
prerequisites:[
"Relational databases and SQL including joins, aggregations, indexes, and basic transactions",
"Computer networking including HTTP semantics, status codes, headers, and the request-response cycle",
"Software engineering and at least one server-side language at an intermediate level",
"Version control with Git including branching, pull requests, and merge workflows",
"Basic understanding of authentication concepts including cookies, sessions, and tokens",
],
gaps:[
"Event-driven and message-broker architecture: Kafka and RabbitMQ for asynchronous service integration, outbox pattern, saga choreography, and at-least-once versus exactly-once delivery semantics.",
"gRPC and Protocol Buffers: high-performance binary serialization, bi-directional streaming, and code generation for inter-service communication in latency-sensitive microservice environments.",
"Database replication, sharding, and disaster recovery: read replica routing, horizontal partitioning strategies, point-in-time recovery, and failover runbooks.",
"OAuth 2.0 authorization server implementation: building an authorization server with authorization code plus PKCE flow, token introspection, and scope management.",
"Real-time communication protocols: WebSockets, Server-Sent Events, and the back-end infrastructure requirements for live data delivery to many concurrent clients.",
],
project:{
description:"Teams build a complete back-end service for a chosen domain, progressing from a basic CRUD REST API and relational data model to a full platform with GraphQL, secure authentication and RBAC authorization, a Redis caching layer, and demonstrated horizontal-scaling behavior under load.",
outcome:"A running back-end service with a versioned OpenAPI specification, an ERD with documented normalization decisions and a migration history, k6 load-test reports showing throughput and latency at one, two, and four application replicas, an automated test suite covering integration and Pact contract tests, and a technical report explaining caching strategy and consistency guarantees.",
feedback:"Milestone 1 reviews the REST API and relational schema design with written feedback on normalization decisions and index coverage. Milestone 2 evaluates the GraphQL implementation and authentication/authorization design. The final milestone is the full platform with caching and load-test evidence, assessed through a live API demo and schema walk-through.",
depth:"Students must derive schema normalization from first principles and demonstrate how violations would produce update anomalies, implement REST and GraphQL access patterns over a shared data layer, reason about cache invalidation consistency when writes occur through both access patterns, and demonstrate horizontal scalability with empirical load-test evidence.",
}},
{id:"SE5",conc:"SE",
title:"Engineering of AI Systems (MLOps and LLMOps)",
description:"Apply DevOps discipline to machine-learning and LLM systems, automating data pipelines, model training, deployment, monitoring, and continuous delivery from experiment to governed production.",
roles:[
{role:"MLOps Engineer",does:"Designs and operates CI/CD pipelines for ML model training and deployment, manages experiment tracking and model registries with version-controlled promotion workflows, implements statistical drift detection and retraining triggers, and runs medallion data pipelines with quality gates and schema contracts."},
{role:"LLMOps / AI Platform Engineer",does:"Deploys and operates LLM inference services with token-economy cost control, manages RAG pipelines and vector databases, instruments LLM calls with trace-level cost and latency logging via Langfuse, implements evaluation suites and guardrails, and governs AI systems against OWASP LLM Top 10 risks."},
],
principles:[
"Production AI failure taxonomy: most production failures stem from data drift, infrastructure degradation, or latency budget overruns rather than model-quality issues, requiring observability beyond accuracy metrics.",
"Medallion data architecture: Bronze raw, Silver cleaned, and Gold feature layers enforce incremental data quality improvement and enable point-in-time dataset reconstruction for training and auditing.",
"CI/CD for ML: extending software delivery pipelines to include dataset validation, model training, evaluation gating against a held-out benchmark, and registry promotion makes model releases as auditable as software releases.",
"Experiment tracking and reproducibility: linking code version, dataset version, hyperparameters, and evaluation metrics to a single immutable experiment record is the minimum reproducibility contract for a production ML team.",
"Model drift detection: statistical tests distinguish data distribution shift (covariate drift) from concept drift (changing label relationships); each triggers different remediation strategies and has different detection latency.",
"SLI/SLO/error-budget framework applied to AI systems: defining latency, throughput, and accuracy SLOs for model-serving endpoints converts reliability into a quantitative engineering trade-off governed by an error budget.",
"RAG pipeline as a staged retrieval system: chunking, embedding, indexing, retrieval, reranking, and generation are independent, testable stages; each has a separate quality metric and failure mode.",
"LLM token economy: input and output token counts jointly determine cost, latency, and context-window feasibility; prompt compression, caching, and model selection are the primary cost-control levers.",
"Agent observability and trace-level accountability: logging tool calls, intermediate reasoning steps, token usage, and latency at the span level enables root-cause analysis of multi-step agent failures invisible in aggregate metrics.",
"OWASP LLM Top 10 threat taxonomy: prompt injection, insecure output handling, training data poisoning, model denial-of-service, and supply-chain vulnerabilities require architectural mitigations beyond perimeter security.",
],
tools:["Docker","Kubernetes","GitHub Actions","Apache Airflow","MLflow","DVC","Great Expectations","EvidentlyAI","Langfuse","Qdrant"],
prerequisites:[
"Machine learning including model training, evaluation, and selection",
"Software engineering and Python including scripting, packaging, testing, and Git",
"Operating systems and networking including containers, Linux basics, and HTTP",
"Familiarity with LLMs and RAG concepts from AI1 or equivalent background",
"Basic CI/CD concepts and version control workflows",
],
gaps:[
"Hardware-level inference optimization: TensorRT model compilation, disaggregated prefill/decode serving, speculative decoding, and INT4/INT8 quantization for high-throughput LLM serving at GPU cost.",
"Online learning and continual training with streaming data: handling concept drift through incremental model updates without full retraining, with guarantees on forgetting and stability.",
"Multi-tenant AI platform engineering: compute and memory quota management, namespace isolation, cost chargeback modeling, and fair scheduling across competing teams on shared GPU infrastructure.",
"Formal AI auditing and regulatory compliance: producing model cards for high-risk AI systems, mapping system capabilities to EU AI Act risk categories, and implementing NIST AI RMF controls.",
"Shadow deployment and statistical A/B testing for model comparison: designing randomized experiments in production, computing required sample sizes, and applying sequential hypothesis testing.",
],
project:{
description:"Teams carry a chosen AI service from specification through governed production deployment, implementing DevOps, DataOps, MLOps, LLMOps, and AgentOps layers, including Airflow-managed data pipelines with Great Expectations quality gates, GitHub Actions CI/CD with MLflow evaluation gating, a RAG service with Langfuse trace-level observability, and a security and governance review against OWASP LLM Top 10.",
outcome:"A live end-to-end AI service demo with Prometheus/Grafana dashboards covering latency and throughput SLOs, a Langfuse trace dashboard showing per-call token cost and tool-use patterns, a passing automated evaluation suite, a documented OWASP LLM Top 10 risk review with mitigations, an Airflow DAG with enforced data contracts, and an MLflow experiment registry with at least one promoted model version.",
feedback:"Milestone 1 covers the DataOps pipeline and CI/CD skeleton with written feedback on data-contract coverage and pipeline idempotency. Milestone 2 evaluates MLOps and LLMOps integration with evaluation suite and drift monitoring. The final milestone is the AgentOps and governance review with a live end-to-end demo, assessed through a Q&A panel probing the weakest instrumented pipeline stage and the most credible OWASP threat path.",
depth:"Students must reason about failure modes invisible to modeling metrics by designing observability that surfaces data-quality, latency, and drift issues before they degrade user experience; implement data contracts and quality gates that catch upstream problems; trace token cost through the economics model to justify prompt-engineering decisions; and apply OWASP LLM threat taxonomy as a systematic architectural review, not a checklist.",
}},
{id:"SE6",conc:"SE",
title:"Mobile, IoT and Edge Software Development",
description:"Develop software for mobile, IoT, and edge devices where connectivity, power, and compute are constrained and data is processed close to where it is generated.",
roles:[
{role:"Mobile Software Engineer",does:"Builds and ships cross-platform mobile applications using Flutter or React Native, implements offline-first data layers with local SQLite storage and sync conflict resolution, integrates device sensors and push notification pipelines, and optimizes battery and memory consumption for production releases."},
{role:"IoT Platform Engineer",does:"Designs device-to-cloud communication pipelines using MQTT and CoAP, provisions and maintains edge processing nodes, authors Node-RED flows for sensor-actuator orchestration, and defines QoS policies and broker topology for reliable message delivery at scale."},
],
principles:[
"Publish-subscribe messaging semantics and QoS levels (at-most-once, at-least-once, exactly-once) governing broker delivery guarantees.",
"Constrained-device RESTful communication via CoAP including observe, confirmable/non-confirmable messages, and block-wise transfer.",
"Edge and fog latency economics: the trade-off between round-trip latency to cloud, bandwidth cost, and local compute capacity.",
"Ubiquitous and pervasive computing models: embedding computation in physical environments and the implications for software architecture.",
"Local-first design: prioritizing local state as the source of truth and treating cloud sync as asynchronous replication.",
"Eventual consistency and the conditions under which distributed replicas converge without coordination.",
"Conflict-free Replicated Data Types (CRDTs): algebraic structures that guarantee merge commutativity and associativity across concurrent edits.",
"Synchronization protocol design: delta sync, vector clocks, and hybrid logical clocks for detecting and ordering divergence.",
"Mobile application lifecycle management: how OS-level state transitions constrain resource use and data durability.",
"Security and privacy across device trust boundaries: threat surfaces introduced by constrained devices, open wireless channels, and shared edge infrastructure.",
],
tools:["Flutter","Dart","React Native","SQLite","Eclipse Mosquitto","paho-mqtt","aiocoap","Node-RED","Raspberry Pi","Firebase"],
prerequisites:[
"Programming fundamentals in at least one high-level language (functions, control flow, data structures)",
"Operating systems concepts: processes, threads, scheduling, and memory management",
"Computer networks fundamentals: TCP/IP stack, HTTP, DNS, and basic socket programming",
"Version control with Git including branching and pull-request workflows",
"Basic understanding of client-server architecture and REST APIs",
],
gaps:[
"Native Android development with Kotlin: platform-specific APIs, Jetpack Compose, and Android Studio toolchain.",
"Native iOS development with Swift: UIKit and SwiftUI, App Store submission, and Apple platform security model.",
"Real-time operating systems and bare-metal firmware: FreeRTOS, interrupt-driven programming, and microcontroller register-level access.",
"Wide-area IoT network protocols: LoRaWAN, NB-IoT, Sigfox, and their energy-harvesting and duty-cycle constraints.",
"Hardware-level sensor calibration, PCB design, and embedded driver development.",
],
project:{
description:"Teams build one connected system spanning a cross-platform mobile app, one or more IoT sensors wired to a Raspberry Pi edge node, and an edge processing component that filters and aggregates sensor data locally; the system communicates device-to-edge over MQTT and edge-to-app over CoAP, operates fully offline, and synchronizes state reliably with automatic conflict resolution when connectivity resumes.",
outcome:"Teams submit a runnable codebase (mobile app, edge firmware/scripts, broker configuration), a live demonstration with connectivity intentionally disrupted and restored to prove offline-first behavior and conflict resolution, and a written architecture document explaining QoS choices, CRDT or merge strategy, and edge/cloud/device computation partitioning decisions.",
feedback:"Three milestone checkpoints: (1) end of week 4, sensor-to-broker pipeline operational and mobile app reading live data online; (2) end of week 8, offline mode implemented with local SQLite persistence and sync trigger on reconnect; (3) end of week 12, conflict resolution proven under deliberate concurrent edits, edge processing logic benchmarked against cloud-only baseline. Each checkpoint yields written instructor feedback on correctness, protocol choices, and architecture trade-offs.",
depth:"The project integrates five core principles simultaneously: teams must choose and justify MQTT QoS levels, implement CoAP observe for edge-to-app streaming, design a CRDT or merge function for at least one conflicting data type, demonstrate that the mobile app satisfies local-first invariants under complete network partition, and quantify the latency and bandwidth saving of edge pre-aggregation versus raw sensor forwarding to cloud.",
}},
{id:"SE7",conc:"SE",
title:"Design of AI-based and Data-Intensive Systems",
description:"Architect large systems whose core is data and machine learning, balancing throughput, latency, consistency, and the demands of AI workloads.",
roles:[
{role:"Data Engineer",does:"Designs, builds, and maintains batch and streaming ETL/ELT pipelines using Spark and Kafka, manages lakehouse schemas with dbt and Parquet, enforces data quality contracts with Great Expectations, tracks data lineage, and ensures pipelines meet SLA and exactly-once delivery requirements in production."},
{role:"ML Platform Engineer",does:"Integrates trained ML models into production serving infrastructure, manages feature stores and training-serving skew, instruments model monitoring and drift detection with Evidently, tracks experiments with MLflow, and designs the architecture for reliable, low-latency model inference behind data pipelines."},
],
principles:[
"Reliability, scalability, and maintainability as independent first-class system properties with distinct design levers and failure modes.",
"Storage-engine internals: B-tree vs LSM-tree trade-offs, write amplification, compaction strategies, and their impact on read and write performance profiles.",
"MapReduce computational model: how large-scale batch computation is expressed as embarrassingly parallel transformations over partitioned data with a shuffle boundary.",
"Event-time dataflow: distinguishing event time from processing time, watermark semantics, and windowing strategies (tumbling, sliding, session) for streaming aggregations.",
"Replication strategies (single-leader, multi-leader, leaderless) and their consistency guarantees, replication lag, and conflict-handling models.",
"Partitioning schemes (range vs hash) and their interaction with hotspot risk, secondary index design, and cross-partition query cost.",
"CAP theorem and PACELC: the fundamental consistency-availability trade-off under network partition and the latency-consistency trade-off under normal operation.",
"Distributed consensus and exactly-once semantics: how Paxos-derived protocols underpin leader election and transactional log commits in distributed databases and streaming systems.",
"Hidden technical debt in ML systems: the full surface area beyond the model code, including data dependencies, feedback loops, monitoring gaps, and undeclared consumers.",
"ETL versus ELT architectural philosophy: when to transform before loading versus leveraging in-warehouse compute, and the implications for data freshness, schema coupling, and governance.",
],
tools:["Apache Kafka","Apache Spark / PySpark","Databricks","Apache Parquet","Apache Airflow","dbt","Apache Cassandra","MLflow","Great Expectations","Docker"],
prerequisites:[
"Relational databases and SQL: joins, indexes, transactions, and normalization",
"Algorithms and data structures: sorting, hashing, trees, and asymptotic complexity",
"Machine learning fundamentals: supervised learning, model training and evaluation, overfitting",
"Python programming with pandas and basic scripting",
"Basic understanding of distributed systems concepts: client-server, network calls, and latency",
],
gaps:[
"Real-time feature engineering and online learning: systems that update model parameters incrementally from live event streams.",
"Data mesh architecture: domain-oriented data ownership, data products as first-class artifacts, and federated governance.",
"Graph databases and knowledge graph pipelines: RDF, property graphs, SPARQL, and graph-native traversal workloads.",
"Advanced ML model explainability and algorithmic fairness: SHAP values, counterfactual explanations, and bias auditing frameworks.",
"FinOps and cloud cost optimization for data platforms: spot instance strategies, autoscaling, and cost attribution across multi-tenant pipelines.",
],
project:{
description:"Teams build one end-to-end data-intensive system that ingests a real multi-source dataset through a Kafka topic, processes it via PySpark ETL and dbt ELT transformations into a partitioned Parquet lakehouse stored in Cassandra, integrates a trained ML model served through MLflow for inference on arriving records, and adds Great Expectations quality gates and Evidently drift monitoring across the full pipeline.",
outcome:"Teams submit the full pipeline codebase (Dockerized), a live demonstration running on a seeded dataset that includes injected data-quality violations and a simulated model drift scenario, an architecture decision record (ADR) justifying partitioning scheme and replication factor choices, and a one-page operational runbook covering failure modes and recovery procedures.",
feedback:"Four milestone checkpoints: (1) week 3, Kafka ingestion and PySpark transformation producing clean Parquet output; (2) week 6, dbt ELT layer and Cassandra partitioning scheme operational with Great Expectations suite passing; (3) week 9, MLflow-tracked model integrated into serving path with latency benchmarks; (4) week 12, Evidently drift dashboard live and pipeline demonstrated with injected anomalies. Each checkpoint receives written feedback on architectural choices, correctness of data-quality contracts, and CAP trade-off justifications.",
depth:"The project is non-trivial because students must simultaneously satisfy exactly-once delivery semantics across the Kafka-to-Parquet boundary, choose and justify a Cassandra partition key that avoids hotspots under the actual data distribution, demonstrate that the Great Expectations suite catches the three injected anomaly types without false positives, and show that the Evidently monitoring dashboard correctly flags the simulated distribution shift before the model's accuracy degrades beyond a defined threshold.",
}},
{id:"SE10",conc:"SE",
title:"Human-Machine Interaction",
description:"Bridge cognitive science, design, and AI to produce interfaces that are effective, efficient, and inclusive, covering perception and cognition theory, UX design, multimodal input, accessibility, and AI-augmented interaction patterns.",
roles:[
{role:"UX Designer",does:"Conducts contextual inquiries and user interviews, synthesizes findings into personas and journey maps, produces low-fidelity wireframes and high-fidelity interactive Figma prototypes, runs moderated usability tests with recruited participants, audits interfaces against WCAG 2.2, and delivers annotated design system component libraries with usability evaluation reports to engineering teams."},
{role:"Product Designer",does:"Instruments product analytics and A/B tests using tools like PostHog, interprets quantitative usage data to drive design iteration, integrates AI-augmented features into existing products, translates WCAG compliance requirements into component-level implementation specs, and collaborates with ML and engineering on the interaction design of AI-powered features."},
],
principles:[
"Human information-processing theory: the architecture of perception, selective attention, and working memory capacity limits as hard constraints on interface information density.",
"Mental models and Norman's gulfs: the gulf of evaluation (can the user tell what happened?) and the gulf of execution (can the user figure out what to do?) as diagnostic frameworks for interaction failure.",
"Affordances, signifiers, mappings, and feedback: the four properties that make an interface element self-explanatory without requiring learned conventions.",
"Fitts' Law: the logarithmic relationship between target distance and size and movement time, used to predict and optimize click target placement and menu structure.",
"GOMS models (Goals, Operators, Methods, Selection rules): a cognitive engineering framework for predicting task completion time and identifying inefficient interaction sequences before user testing.",
"Gestalt principles for visual interface layout: proximity, similarity, continuity, closure, and figure-ground as perceptual rules that explain why users group or separate interface elements.",
"Multimodal fusion theory: how voice, gesture, and gaze inputs are combined and disambiguated, and the trade-offs between unimodal and multimodal interaction.",
"WCAG 2.2 perceivable, operable, understandable, and robust principles: the four-pillar framework that makes accessibility requirements systematic and testable rather than ad hoc.",
"A/B testing theory: statistical power, Type I and Type II error rates, minimum detectable effect, and sequential testing corrections needed to draw valid causal inferences from interface experiments.",
"Adaptive and personalized systems: user modeling approaches, context-aware recommendation, and the privacy and manipulation risks introduced by systems that change their own interface based on inferred user state.",
],
tools:["Figma","Miro","axe DevTools","WAVE","System Usability Scale (SUS)","Lookback","Web Speech API","PostHog","Python","OpenAI API"],
prerequisites:[
"Software engineering fundamentals: ability to read and write basic web front-end code (HTML, CSS, JavaScript) sufficient to instrument a prototype",
"Probability and statistics: hypothesis testing, p-values, confidence intervals, and basic experimental design",
"Human-computer interface concepts: familiarity with common UI patterns (navigation, forms, modals) and at least one design or prototyping tool",
"Basic Python scripting: sufficient to run analysis scripts on survey or analytics data",
"Introductory cognitive psychology or behavioral science exposure (helpful but not required)",
],
gaps:[
"Advanced physiological measurement: EEG-based cognitive load measurement, infrared eye-tracking hardware, galvanic skin response, and neuroergonomics research methods.",
"Embodied and tangible user interfaces: augmented and virtual reality interaction design, haptic feedback, mid-air gesture systems, and physical computing.",
"Longitudinal and large-scale field studies: diary study methodology, experience sampling, and cohort analysis of retention and engagement over weeks or months.",
"Affective computing and emotion recognition: valence-arousal models, facial action coding, sentiment analysis in conversational UI, and ethical implications of emotion-aware systems.",
"Cross-cultural and localization design: Hofstede cultural dimensions applied to interface conventions, right-to-left layout adaptation, and global accessibility standards beyond WCAG.",
],
project:{
description:"Teams design, prototype, and evaluate one human-machine interface for a real system or well-defined domain problem, evolving across 13 weeks from user-research synthesis through low-fidelity concept sketches into a high-fidelity Figma prototype with at least one implemented multimodal input channel (voice, gesture, or gaze via Web Speech API), an AI-augmented layer (adaptive recommendation or conversational UI via OpenAI API), WCAG 2.2 Level AA compliance, and a final usability evaluation report backed by two rounds of moderated testing and a designed A/B test.",
outcome:"Teams submit: the Figma prototype with all interactive flows and a linked component library, a Miro board documenting the full research-to-design trajectory (personas, journey map, low-fi sketches, iteration log), a WCAG 2.2 audit report produced with axe DevTools and WAVE showing zero critical violations, a usability evaluation report presenting SUS scores and thematic findings from both test rounds, a PostHog analytics dashboard screenshot showing at least three instrumented interaction events, and a documented A/B test design with power calculation justifying the proposed sample size.",
feedback:"Five milestone checkpoints: (1) week 2, user research plan approved and contextual inquiry conducted with at least five participants; (2) week 4, low-fidelity wireframes peer-reviewed against Gestalt and affordance criteria; (3) week 7, first round of moderated usability testing completed and findings presented to class for critique; (4) week 10, high-fidelity prototype with multimodal input and AI layer demonstrated, WCAG audit run; (5) week 13, second usability test round complete and final report submitted.",
depth:"The design must simultaneously satisfy contradictory forces: the AI-augmented layer must demonstrably improve task efficiency without introducing the gulf-of-evaluation failure mode; the multimodal input must degrade gracefully when the recognition pipeline fails; the WCAG compliance must be structural rather than cosmetic; and the A/B test design must show genuine understanding of statistical power by calculating whether the realistic user base could detect the minimum meaningful effect size.",
}},
{id:"AI1",conc:"AI",
title:"Foundations of Machine Learning",
description:"Build rigorous understanding of supervised, unsupervised, and ensemble learning by deriving and implementing core algorithms from first principles, selecting and justifying models with statistical evidence.",
roles:[
{role:"Machine Learning Engineer",does:"Frames business problems as machine learning tasks, selects and justifies model families using cross-validated benchmark evidence, implements pipelines with scikit-learn and pandas, tunes hyperparameters systematically with grid and random search, interprets model predictions using SHAP values, and delivers reproducible experiment reports with MLflow tracking."},
{role:"Data Scientist",does:"Acquires, cleans, and performs exploratory data analysis on real-world datasets, engineers features using domain knowledge, trains and evaluates supervised and unsupervised models with statistically sound train/validation/test protocols, communicates findings through interactive dashboards, and maintains data and model versioning for reproducibility."},
],
principles:[
"The bias-variance trade-off: model complexity increases variance and reduces bias; the optimal model minimizes their sum on unseen data, not training data.",
"Empirical risk minimization: learning as optimization of a loss function over a training distribution, with generalization depending on the function class capacity and sample size.",
"Regularization as a capacity constraint: L1 (Lasso) and L2 (Ridge) penalties shrink model parameters, trading increased bias for reduced variance to improve held-out performance.",
"Probabilistic foundations of classification: models such as logistic regression and naive Bayes estimate class posteriors P(y|x) using Bayes' rule over learned likelihoods.",
"Decision tree induction and information criteria: recursive binary splitting maximizes information gain (entropy reduction) or Gini impurity reduction at each node.",
"Ensemble learning by variance reduction: bagging averages predictions of high-variance base learners trained on bootstrap samples, reducing ensemble variance without changing bias.",
"Gradient boosting as additive residual correction: each tree is fitted to the pseudo-residuals of the current ensemble, implementing functional gradient descent in prediction space.",
"Cross-validation and statistical model comparison: k-fold cross-validation estimates generalization error; paired t-tests and Friedman tests compare algorithm performance across datasets.",
"The curse of dimensionality: as feature dimension grows, distance metrics lose discriminative power and volume concentrates near the surface, motivating dimensionality reduction.",
"Unsupervised structure discovery: k-means minimizes within-cluster inertia via coordinate descent; hierarchical clustering builds a dendrogram via linkage criteria; DBSCAN identifies density-connected components without specifying k.",
],
tools:["Python","scikit-learn","pandas","NumPy","Matplotlib","Seaborn","MLflow","Jupyter","SHAP","Optuna"],
prerequisites:[
"Linear algebra: vectors, matrix multiplication, eigendecomposition, SVD",
"Probability and statistics: probability distributions, Bayes' theorem, hypothesis testing, confidence intervals",
"Calculus: partial derivatives, gradients, chain rule, and basic optimization",
"Python programming: functions, loops, list comprehensions, NumPy and pandas at a basic level",
"Basic data literacy: reading tabular data, understanding distributions and summary statistics",
],
gaps:[
"Deep learning and neural networks: backpropagation, architecture design, GPU training, and modern frameworks such as PyTorch.",
"Model deployment and MLOps: serving models in production, monitoring drift, versioning, and CI/CD pipelines for ML.",
"Causal inference: distinguishing correlation from causation, potential outcomes framework, and instrumental variable methods.",
"Advanced probabilistic models: Gaussian processes, variational inference, and Bayesian optimization.",
"Graph machine learning: node classification, link prediction, and graph neural networks for relational data.",
],
project:{
description:"Teams select a real-world tabular dataset from a domain of their choice, conduct a full supervised and unsupervised analysis cycle: EDA and feature engineering, baseline model selection, systematic hyperparameter search, ensemble construction, SHAP-based interpretability, and a clustering analysis to discover latent structure in the same data.",
outcome:"A reproducible MLflow-tracked experiment repository containing: a Jupyter analysis notebook, a scikit-learn pipeline exported as a serialized artifact, a model comparison table with cross-validation means and confidence intervals for at least five model families, a SHAP summary plot with written interpretation, a clustering evaluation report with silhouette scores and cluster profiles, and a 10-minute recorded video presentation.",
feedback:"Three milestone checkpoints: (1) week 3, EDA and baseline models with written feedback on feature engineering choices and evaluation protocol; (2) week 7, full supervised pipeline with hyperparameter search and SHAP report, peer-reviewed by another team; (3) week 12, complete submission including clustering analysis and video presentation, assessed by the instructor with a written rubric covering correctness, depth, and communication.",
depth:"The project is demanding because students must justify every modeling choice with statistical evidence: why this model family for this data distribution, how the regularization strength was chosen, what the SHAP values reveal about feature importance relative to domain expectations, and how the clustering structure relates to the supervised labels. Cookie-cutter pipelines without interpretation evidence do not pass the milestone rubric.",
}},
{id:"AI2",conc:"AI",
title:"Deep Learning",
description:"Derive and implement neural networks from the calculus and linear algebra upward, then scale to modern architectures: CNNs, RNNs, Transformers, and generative models.",
roles:[
{role:"Deep Learning Engineer",does:"Implements and trains neural networks in PyTorch, designs CNN and Transformer architectures for image and text tasks, diagnoses and resolves training instability through learning-rate scheduling, gradient clipping, and normalization, profiles GPU memory and throughput, and delivers reproducible experiments with Weights and Biases tracking."},
{role:"AI Research Engineer",does:"Reproduces published deep learning results from paper to running code, performs ablation studies to identify which components drive performance, adapts pre-trained models through fine-tuning and transfer learning for new tasks and domains, and writes structured experiment reports comparing architecture decisions with empirical evidence."},
],
principles:[
"Backpropagation as automatic differentiation: the chain rule applied recursively through a computational graph computes the gradient of any scalar loss with respect to every parameter in O(forward) time.",
"Gradient descent and learning-rate dynamics: SGD with momentum and adaptive optimizers (Adam, AdaGrad) navigate loss landscapes by exploiting first- and second-moment estimates of the gradient.",
"Vanishing and exploding gradients: in deep networks gradients compound multiplicatively through layers; residual connections, layer normalization, and careful initialization prevent gradient pathology.",
"Convolutional inductive bias: weight sharing and local receptive fields encode the assumption that spatial features are translation-invariant, drastically reducing parameters relative to dense layers.",
"Recurrence and sequence modeling: RNNs process sequences by maintaining hidden state across time steps; LSTMs and GRUs gate information flow to selectively retain or forget context.",
"Attention as soft information retrieval: the scaled dot-product attention mechanism computes a weighted sum of values, where weights are query-key similarities, enabling direct long-range dependency modeling.",
"Transformer architecture: multi-head self-attention over positional-encoded token sequences, interleaved with feed-forward sublayers and residual connections, forms the backbone of modern NLP, vision, and multimodal models.",
"Regularization in deep networks: dropout, weight decay, data augmentation, and early stopping each combat overfitting through different mechanisms: noise injection, weight penalty, input diversity, and capacity limiting.",
"Transfer learning and fine-tuning: pre-trained representations encode general-purpose features; fine-tuning a pre-trained model on a small task-specific dataset typically outperforms training from scratch.",
"Generative models and latent space structure: VAEs learn a regularized latent distribution by jointly maximizing reconstruction likelihood and minimizing KL divergence; GANs frame generation as a minimax game between a generator and discriminator.",
],
tools:["PyTorch","torchvision","Hugging Face Transformers","Weights and Biases","CUDA","NumPy","Matplotlib","scikit-learn","Captum","Google Colab / NVIDIA GPU"],
prerequisites:[
"Machine learning fundamentals including supervised learning, loss functions, and cross-validation (AI1 or equivalent)",
"Linear algebra: matrix operations, eigendecomposition, and SVD",
"Calculus: partial derivatives, chain rule, and gradients",
"Python programming with NumPy at an intermediate level",
"Basic probability and statistics",
],
gaps:[
"Large-scale distributed training: data parallelism, tensor parallelism, gradient checkpointing, and mixed-precision training across multiple GPUs and nodes.",
"Neural architecture search and automated ML: differentiable NAS, Bayesian optimization over architectures, and efficient cell-based search spaces.",
"Multimodal models: cross-modal attention, vision-language pretraining, and architectures such as CLIP and Flamingo.",
"Model compression and edge deployment: knowledge distillation, structured and unstructured pruning, quantization-aware training, and ONNX export.",
"Fairness and robustness: adversarial examples, certified robustness, fairness metrics, and debiasing techniques for production models.",
],
project:{
description:"Teams choose a deep learning task (image classification, text classification, sequence generation, or a self-proposed task) and build a full research cycle: dataset preparation, baseline implementation and training, architecture ablation, regularization tuning, and a transfer-learning comparison, then present findings as a structured experiment report in the style of a workshop paper.",
outcome:"A Weights-and-Biases project with full training logs for at least six experimental conditions, a written experiment report (4-6 pages) with a model comparison table including test accuracy, training time, and parameter counts, learning-curve and confusion-matrix figures, a section analyzing at least two failure modes with visualizations, and a live 15-minute demo showing the model running inference on new inputs.",
feedback:"Milestone 1 (week 4): baseline model training and first W&B run reviewed, written feedback on training stability and evaluation protocol. Milestone 2 (week 8): ablation study results reviewed in a team meeting, feedback on experimental design and confounders. Final (week 13): full report and demo assessed by instructor and one external reviewer using a structured rubric covering technical rigor, depth of analysis, and presentation clarity.",
depth:"Students must implement at least one architectural component from scratch (a self-attention module, a residual block, or a custom loss function) rather than calling a library wrapper, and must provide a written derivation connecting the implementation to its mathematical definition. The ablation study must include at least one negative result with an explanation of why the expected improvement did not materialize.",
}},
{id:"AI3",conc:"AI",
title:"Natural Language Processing",
description:"Master NLP from linguistic structure and classical algorithms through modern Transformer-based models, building systems that understand, generate, and reason over text.",
roles:[
{role:"NLP Engineer",does:"Builds and fine-tunes text classification, named entity recognition, and sequence-to-sequence models using Hugging Face Transformers, designs tokenization and data preprocessing pipelines, evaluates models with appropriate metrics (F1, BLEU, BERTScore), implements retrieval-augmented generation pipelines, and deploys NLP services as FastAPI endpoints with structured logging."},
{role:"Conversational AI Engineer",does:"Designs and implements dialogue systems with intent classification and slot filling, builds RAG pipelines integrating vector databases and LLM APIs, implements evaluation harnesses for conversational quality, and manages LLM prompt engineering and chain-of-thought reasoning for complex tasks."},
],
principles:[
"Language as a structured discrete system: phonology, morphology, syntax, and semantics form nested levels of linguistic representation, each with its own formal grammar and computational complexity class.",
"Statistical language models and the n-gram: a Markov approximation of language assigns probability to a word given its preceding context; higher-order models reduce approximation error at exponential data cost.",
"Distributional semantics: words with similar distributional contexts have similar meanings; word embeddings (Word2Vec skip-gram, GloVe) operationalize this hypothesis as dense vectors in a learned metric space.",
"Sequence labeling with CRFs: conditional random fields model the joint probability of a label sequence given observations, capturing transition dependencies that independent-output classifiers cannot.",
"Encoder-decoder architectures for seq2seq: the encoder compresses a source sequence into a context representation; the decoder generates a target sequence conditioned on it, enabling translation, summarization, and question answering.",

principles:[
"Image formation and the pinhole camera model: perspective projection maps 3D world points to 2D image coordinates via the intrinsic matrix; lens distortion, focal length, and sensor resolution jointly determine image geometry.",
"The spatial convolution theorem: convolution in the spatial domain is multiplication in the frequency domain; this equivalence underlies edge detection, blurring, and sharpening as low-, high-, and band-pass filter operations.",
"Local invariant feature detectors (SIFT, SURF, ORB): keypoint detectors find salient image regions that are approximately invariant to scale, rotation, and illumination change; descriptors encode local gradient histograms for matching.",
"Convolutional neural network feature hierarchy: low-level layers detect edges and textures; mid-level layers detect object parts; high-level layers encode semantic concepts. This hierarchical abstraction generalizes across datasets when transferred.",
"Classification, detection, and segmentation as a taxonomy of spatial tasks: classification assigns a single label to an image; detection localizes objects with bounding boxes and class labels; segmentation assigns a label to every pixel.",
"Anchor-based detection (Faster R-CNN): a Region Proposal Network generates candidate bounding boxes relative to pre-defined anchor shapes; a detection head classifies and refines each proposal.",
"Anchor-free detection (YOLO, FCOS): instead of anchors, the model predicts offsets from keypoints or grid cells; anchor-free designs simplify training and improve recall for objects at unusual aspect ratios.",
"Semantic and instance segmentation: semantic segmentation labels each pixel with a class; instance segmentation additionally separates individual object instances. Mask R-CNN extends Faster R-CNN with a parallel mask head.",
"Data augmentation as a regularizer for vision: random crops, flips, color jitter, and geometric distortions increase effective dataset size and encourage invariances that the model should have but the raw data does not provide.",
"Transfer learning in computer vision: ImageNet-pre-trained backbone weights encode reusable low- and mid-level representations; fine-tuning with a small domain-specific dataset routinely outperforms training from scratch.",
],

{role:"Robotics and Control Engineer",does:"Applies RL to continuous-control tasks in simulation (MuJoCo, Isaac Gym), implements reward engineering and curriculum strategies, bridges sim-to-real transfer with domain randomization, integrates RL policies into ROS2 action clients, and evaluates policy performance in hardware-in-the-loop or physical robot settings."},

principles:[
"Markov decision processes: the MDP tuple (S, A, P, R, gamma) formalizes sequential decision-making; the Markov property asserts that future state depends only on the current state and action, not the full history.",
"Bellman equations and dynamic programming: the Bellman optimality equations express Q* and V* as recursive expectations over immediate reward plus discounted future value; policy iteration and value iteration solve these exactly for known MDPs.",
"Temporal difference learning: TD methods update value estimates toward bootstrapped targets using real experience, combining the sample efficiency of Monte Carlo methods with the immediacy of dynamic programming.",
"Q-learning and SARSA: Q-learning is off-policy and converges to Q* regardless of behavior policy; SARSA is on-policy and converges to the value of the current policy, making it safer in environments with catastrophic actions.",
"Deep Q-Networks: function approximation with a neural network stabilized by experience replay (breaking correlation) and a target network (breaking non-stationarity), enabling Q-learning to scale to high-dimensional state spaces.",
"Policy gradient theorem: directly differentiating expected return with respect to policy parameters via the log-derivative trick enables gradient ascent on policy performance without needing a value function.",
"Actor-critic architecture: combining a policy (actor) that selects actions with a value function (critic) that estimates returns reduces the variance of policy gradient estimates via baseline subtraction.",
"Proximal Policy Optimization: PPO clips the probability ratio between the new and old policy in the surrogate objective, preventing destructively large policy updates without the complexity of natural-gradient methods.",
"Exploration-exploitation trade-off: pure exploitation gets stuck in local optima; epsilon-greedy, Boltzmann, and Upper Confidence Bound strategies balance exploring the state space against exploiting known good actions.",
"Reward engineering and the credit assignment problem: sparse rewards delay the learning signal, making credit assignment over long horizons difficult; reward shaping, intrinsic motivation, and hierarchical RL are the primary mitigations.",
],

roles:[
{role:"LLM Application Engineer",does:"Designs and builds LLM-powered applications using OpenAI, Anthropic, and open-source APIs, implements RAG pipelines with vector databases, engineers and systematically evaluates prompts and chain-of-thought strategies, instruments inference costs and latency with Langfuse, and governs application risk against OWASP LLM Top 10."},
{role:"AI Product Engineer",does:"Fine-tunes open-source models (Mistral, LLaMA) with PEFT/LoRA for domain-specific tasks, manages the full evaluation lifecycle from automated benchmarks through human preference collection, architects multi-agent orchestration workflows, designs responsible-AI controls (guardrails, PII filtering, audit logging), and leads model-selection and cost-modeling decisions for production deployments."},

principles:[
"Transformer architecture and scaled dot-product attention: queries, keys, and values enable soft information retrieval over the full token context window; multi-head attention diversifies the representations captured.",
"Causal language modeling and next-token prediction: auto-regressive training on a masked token sequence instills the model's core competency — predicting the next token given all preceding tokens — and implicitly drives emergent capabilities.",
"Scaling laws: LLM performance on pre-training loss improves as a power law in parameters, data tokens, and compute; the Chinchilla result establishes that compute-optimal training requires scaling data proportionally to parameters.",
"Instruction tuning and RLHF: supervised fine-tuning on instruction-response pairs teaches the model to follow instructions; reinforcement learning from human feedback (PPO from a reward model) aligns generations with human preferences.",
"Parameter-efficient fine-tuning (PEFT/LoRA): inserting low-rank adapter matrices into frozen Transformer layers reduces trainable parameters by 99%, enabling task-specific adaptation on consumer hardware.",
"Retrieval-augmented generation: injecting retrieved documents into the context window grounds generation in external knowledge, reducing hallucination and extending the model's effective knowledge beyond its training cutoff.",
"Prompt engineering: zero-shot, few-shot, and chain-of-thought prompting each exploit different aspects of the model's learned representation; structured output prompting with JSON schemas enables reliable extraction.",
"Evaluation and benchmarking: perplexity on held-out text measures language model quality; task-specific benchmarks (MMLU, HumanEval, HELM) measure capability facets; human preference evaluation (ELO, win-rate) measures alignment.",
"Token economy and latency budget: each LLM call consumes input and output tokens priced per million; context-window length, output verbosity, and model tier jointly determine cost and latency, driving architectural trade-offs.",
"OWASP LLM Top 10 governance: prompt injection, insecure output handling, excessive agency, model theft, and overreliance are the leading risk categories; architectural guardrails, output validation, and scope limitation are the primary mitigations.",
],

roles:[
{role:"Security Analyst (SOC Tier 1–2)",does:"Monitors SIEM dashboards and alert queues, triages incidents by severity using IOC correlation and threat intelligence feeds, conducts initial investigation of suspicious network and endpoint events, applies the Cyber Kill Chain and MITRE ATT&CK framework to classify attacker TTPs, escalates confirmed incidents with documented evidence chains, and produces post-incident reports."},
{role:"GRC Analyst (Governance, Risk, and Compliance)",does:"Conducts asset inventories and qualitative and quantitative risk assessments, maps organizational controls to NIST CSF and ISO 27001 frameworks, writes security policies and exception procedures, tracks remediation actions in a risk register, prepares evidence packages for compliance audits, and communicates residual risk to non-technical stakeholders."},
],
principles:[
"The CIA triad: confidentiality, integrity, and availability are the three independent security properties every control must be evaluated against; trade-offs between them are architectural decisions.",
"Threat modeling with STRIDE: systematically enumerating Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, and Elevation-of-privilege threats against an asset model before implementation.",
"Attack surfaces and trust boundaries: security failures occur at points where data crosses from a less-trusted to a more-trusted context; minimizing the attack surface is always preferable to hardening individual boundaries.",
"Defense in depth: independent, layered security controls ensure that failure of any single control does not compromise the full system.",
"Symmetric cryptography and the AES block cipher: a keyed permutation over fixed-size blocks; modes of operation (CBC, GCM) extend the block cipher to arbitrary-length messages with different confidentiality and integrity guarantees.",
"Public-key cryptography and the RSA and elliptic-curve primitives: asymmetric key pairs enable secure key exchange and digital signatures without a pre-shared secret; security rests on computationally hard number-theoretic problems.",
"Cryptographic hash functions: deterministic one-way functions (SHA-256, SHA-3) produce fixed-length digests; collision resistance, preimage resistance, and second-preimage resistance are the three security properties.",
"The Cyber Kill Chain and MITRE ATT&CK: the Kill Chain models an intrusion as seven sequential phases; ATT&CK provides a granular, empirically-derived taxonomy of adversary tactics, techniques, and procedures.",
"Risk quantification and the CVSS framework: risk is the product of threat likelihood and business impact; CVSS scores standardize the impact and exploitability dimensions of individual vulnerabilities.",
"Zero-trust architecture: explicitly verify identity and device posture for every request, grant least-privilege access, and assume breach — network location is no longer a sufficient trust signal.",
],

{id:"CY2",conc:"CY",
title:"Network Security and Protocols",
description:"Analyze, secure, and attack network infrastructure by mastering protocol internals, traffic analysis, firewall and IDS architecture, VPN engineering, and active network-layer attack techniques.",
roles:[
{role:"Network Security Engineer",does:"Designs and implements firewall rule sets and ACLs for perimeter and internal segmentation, deploys and tunes IDS/IPS signatures using Snort or Suricata, configures IPsec and WireGuard VPN tunnels, analyzes packet captures to investigate suspicious flows, performs network security assessments, and responds to network-layer incidents."},
{role:"Security Operations Engineer",does:"Monitors network telemetry and NetFlow data in a SIEM, builds detection rules for protocol anomalies and lateral movement patterns, conducts traffic analysis investigations using Wireshark and Zeek, manages network security tooling in a SOC environment, and performs threat hunting across packet captures and log data."},
],
principles:[
"The OSI and TCP/IP models as layered security surfaces: each layer has its own attack classes; the attacker targets the layer where the most leverage exists, while the defender must secure all layers.",
"TCP three-way handshake and state machine: the handshake establishes sequence numbers that authenticate segments; SYN flood, RST injection, and session hijacking exploit weaknesses in state management.",
"DNS as critical infrastructure: resolution chains introduce spoofing and cache-poisoning risks; DNSSEC adds origin authentication; DNS-over-HTTPS and DNS-over-TLS encrypt resolver queries.",
"TLS 1.3 handshake: a single round trip establishes authenticated, forward-secret keys via ephemeral Diffie-Hellman; certificate validation, SNI, and ALPN are the key security-relevant fields.",
"Firewall architecture: stateful packet inspection tracks connection state; application-layer gateways parse protocol content; next-generation firewalls add user identity and application awareness.",
"Intrusion detection — signature versus anomaly: signature-based IDS matches known attack patterns (low false positives, blind to zero-days); anomaly-based IDS flags deviation from a baseline (higher false positives, detects novel attacks).",
"VPN tunneling and the IPsec suite: IKEv2 negotiates keying material; ESP provides authenticated encryption of the encapsulated payload; tunnel mode protects the full inner IP header.",
"Network address translation: NAT preserves IPv4 address space and incidentally hides internal topology, but breaks end-to-end connectivity and complicates application-layer protocols.",
"Spanning tree and VLAN hopping: switch-layer protocols designed for reliability (STP, 802.1Q) introduce security risks exploitable by double-tagging and STP root manipulation when default configurations are left in place.",
"Network forensics and flow analysis: NetFlow/IPFIX records connection metadata without payload; full-packet capture provides payload but at extreme storage cost; Zeek produces structured connection logs as a middle ground.",
],

project:{
description:"Teams build and attack a multi-segment lab network in GNS3 or Eve-NG, then harden it: the red phase executes ARP spoofing, VLAN hopping, TCP session hijacking, and a DNS cache-poisoning attack with Scapy; the blue phase designs and implements firewall rules, IDS signatures in Snort/Suricata, a WireGuard VPN between segments, and a Zeek-based detection rule for each attack executed in the red phase.",

depth:"Students must trace each attack through the protocol state machine (why does ARP have no authentication? what field does VLAN hopping abuse? how does TCP session hijacking exploit sequence-number prediction?), write each IDS signature targeting the specific protocol deviation rather than a payload string, and prove that each Zeek detection fires on the replayed attack traffic without false-positiving on legitimate traffic.",
